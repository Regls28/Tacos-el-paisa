<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tacos El Paisa - Cocina</title>
    <!-- Firebase App y Database Legacy SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        header {
            background-color: #8B0000;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        /* CORREGIDO: Las tarjetas ahora se acomodan perfectamente en cuadrícula */
        .grid-ordenes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .tarjeta-orden {
            background: white;
            border-left: 8px solid #FFd700;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .tarjeta-orden h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }
        .items-pedido {
            background: #fff9e6;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-size: 16px;
            line-height: 1.4;
        }
        .btn-completar {
            display: block;
            width: 100%;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            text-align: center;
            transition: background 0.2s;
        }
        .btn-completar:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌮 PANEL DE COCINA - TACOS EL PAISA</h1>
        <p>Haz clic en cualquier parte gris para activar el sonido de los pedidos nuevos</p>
    </header>

    <main class="grid-ordenes" id="contenedor-ordenes">
        <!-- Las órdenes se inyectan aquí dinámicamente -->
    </main>

    <script>
        // CONFIGURACIÓN DE FIREBASE
        const firebaseConfig = {
            databaseURL: "https://tacos-el-paisa-977fb-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Sistema de audio electrónico integrado
        function sonarAlerta() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Primer Beep
                let osc1 = audioCtx.createOscillator();
                let gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain1.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start();
                osc1.stop(audioCtx.currentTime + 0.15);
                
                // Segundo Beep un poco después
                setTimeout(() => {
                    let osc2 = audioCtx.createOscillator();
                    let gain2 = audioCtx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(880, audioCtx.currentTime);
                    gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.start();
                    osc2.stop(audioCtx.currentTime + 0.15);
                }, 250);

            } catch(e) {
                console.log("Audio en espera de interacción.");
            }
        }

        // CONTROL DE ALARMA INTERNA
        let primeraCarga = true;
        
        // CORREGIDO: Evitamos falsos silencios al cargar la app
        setTimeout(() => {
            primeraCarga = false;
        }, 2000);

        // Escuchar órdenes de Firebase en tiempo real
        database.ref('ordenes').on('value', (snapshot) => {
            const contenedor = document.getElementById('contenedor-ordenes');
            contenedor.innerHTML = ''; // Limpiar pantalla anterior
            
            const data = snapshot.val();
            
            if (!data) {
                contenedor.innerHTML = '<p style="padding:20px; font-weight:bold; font-size:18px;">🛑 No hay órdenes pendientes por preparar.</p>';
                return;
            }

            // Si ya pasó la carga inicial y entra algo, suena de inmediato
            if (!primeraCarga) {
                sonarAlerta();
            }

            // Construir tarjetas de comida
            Object.keys(data).forEach((idKey) => {
                const orden = data[idKey];
                
                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta-orden';
                
                let listaProductos = '';
                if(orden.productos) {
                    orden.productos.forEach(p => {
                        listaProductos += `• <b>${p.cantidad}x</b> ${p.nombre} ${p.nota ? '<small>('+p.nota+')</small>' : ''}<br>`;
                    });
                }

                tarjeta.innerHTML = `
                    <div>
                        <h3>Pedido #${idKey.slice(-4).toUpperCase()}</h3>
                        <p><strong>👤 Cliente:</strong> ${orden.cliente || 'Anónimo'}</p>
                        <p><strong>🚗 Tipo:</strong> ${orden.tipoEntrega || 'Para Llevar'}</p>
                        <div class="items-pedido">
                            <strong>Detalle del Pedido:</strong><br>${listaProductos}
                        </div>
                    </div>
                    <button class="btn-completar" onclick="entregarOrden('${idKey}')">✓ Entregado (Cerrar)</button>
                `;
                
                contenedor.appendChild(tarjeta);
            });
        });

        // Borrar el pedido despachado para limpiar el tablero de control
        function entregarOrden(idKey) {
            if(confirm("¿Ya entregaste este pedido? Se borrará de la pantalla de la cocina.")) {
                database.ref('ordenes/' + idKey).remove()
                .then(() => {
                    console.log("Orden archivada y borrada.");
                })
                .catch((error) => {
                    alert("No se pudo borrar: " + error.message);
                });
            }
        }
    </script>
</body>
</html>
