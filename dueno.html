<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Tacos El Paisa</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --primary: #A61C1C;
            --success: #16A34A;
            --warning: #D97706;
            --danger: #DC2626;
            --dark: #1F2937;
            --bg: #F3F4F6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--dark); padding: 20px; }
        
        header {
            background-color: var(--dark);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--primary);
        }

        .grid-ordenes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .card-orden {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 6px solid var(--warning);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-orden.accepted { border-top-color: var(--success); }
        .card-orden.rejected { border-top-color: var(--danger); opacity: 0.7; }

        .timer-box {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #FEF3C7;
            color: #92400E;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .info-cliente { margin: 15px 0; padding: 10px 0; border-top: 1px dashed #E5E7EB; border-bottom: 1px dashed #E5E7EB; }
        .info-cliente p { margin-bottom: 4px; font-size: 0.9rem; }

        .lista-items { margin: 10px 0; list-style: none; }
        .lista-items li { padding: 6px 0; border-bottom: 1px solid #F3F4F6; font-size: 0.95rem; }
        .meta-item { font-size: 0.8rem; color: #6B7280; display: block; }

        .btn {
            width: 100%; padding: 10px; border: none; border-radius: 6px; 
            font-weight: bold; cursor: pointer; margin-top: 8px; transition: all 0.2s;
        }
        .btn-success { background-color: var(--success); color: white; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-print { background-color: #3B82F6; color: white; }
        .btn-warn { background-color: var(--warning); color: white; }
        .btn-dark { background-color: #4B5563; color: white; }

        /* Estilos de Impresión del Ticket */
        @media print {
            body * { visibility: hidden; }
            #ticket-impresion, #ticket-impresion * { visibility: visible; }
            #ticket-impresion { position: absolute; left: 0; top: 0; width: 80mm; font-family: monospace; }
        }

        #ticket-impresion { display: none; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>👨‍🍳 Tacos El Paisa - Cocina</h1>
            <p>Panel de Control de Órdenes en Tiempo Real</p>
        </div>
        <div>
            <label style="color: #9CA3AF; font-size: 0.9rem; cursor: pointer;">
                <input type="checkbox" id="audio-toggle" checked> Alertas de Sonido Activas
            </label>
        </div>
    </header>

    <main class="grid-ordenes" id="contenedor-ordenes">
        </main>

    <div id="ticket-impresion"></div>

    <script>
        // CONFIGURACIÓN DE FIREBASE (Usa tu enlace real)
        const firebaseConfig = {
            databaseURL: "https://tacos-el-paisa-977fb-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Inicializar el objeto de audio del sistema (Tono de Alerta Electrónico Funcional)
        function sonarAlerta() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        let osc = audioCtx.createOscillator();
                        let gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(950, audioCtx.currentTime); // Tono de campana de cocina
                        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.12);
                    }, i * 200);
                }
            } catch(e) {
                console.log("Audio esperando clic en la pantalla.");
            }
        }

        let ordenesLocales = {};
        let timersIntervals = {};

        // 1. ESCUCHAR ÓRDENES EN TIEMPO REAL
        database.ref('ordenes').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                document.getElementById('contenedor-ordenes').innerHTML = '<p style="padding:20px; font-weight:bold;">🛑 No hay órdenes registradas en este momento.</p>';
                ordenesLocales = {};
                return;
            }
            
            // Detectar si entró una orden nueva para hacer sonar el tono
            detectarNuevaOrden(data);
            
            ordenesLocales = data;
            renderizarPanels();
        });

        function detectarNuevaOrden(nuevasOrdenes) {
            Object.keys(nuevasOrdenes).forEach(id => {
                if (!ordenesLocales[id] && nuevasOrdenes[id].estado === 'pendiente') {
                    if (document.getElementById('audio-toggle').checked) {
                        sonarAlerta();
                    }
                }
            });
        }

        // 2. RENDERIZAR LAS TARJETAS EN EL PANEL
        function renderizarPanels() {
            const contenedor = document.getElementById('contenedor-ordenes');
            contenedor.innerHTML = '';

            // Ordenar de más nuevas a más viejas
            const listaIds = Object.keys(ordenesLocales).sort((a, b) => ordenesLocales[b].timestamp - ordenesLocales[a].timestamp);

            listaIds.forEach(id => {
                const orden = ordenesLocales[id];
                const card = document.createElement('div');
                card.className = `card-orden ${orden.estado}`;
                
                // CORREGIDO: Ahora lee 'productos' (tu base de datos real) de forma segura
                let itemsHtml = '';
                const listaComida = orden.productos || orden.items || [];
                
                listaComida.forEach(item => {
                    const nombreItem = item.nombre || item.name || 'Producto';
                    const notaItem = item.nota || item.meta || '';
                    itemsHtml += `<li><b>${item.cantidad}x</b> ${nombreItem} <span class="meta-item">${notaItem ? '('+notaItem+')' : ''}</span></li>`;
                });

                // Lógica del Temporizador de Autocancelación (5 minutos = 300000 ms)
                let timerHtml = '';
                if (orden.estado === 'pendiente') {
                    const tiempoTranscurrido = Date.now() - orden.timestamp;
                    const tiempoRestante = Math.max(0, 300000 - tiempoTranscurrido);
                    
                    if (tiempoRestante <= 0) {
                        autoCancelarOrden(id);
                    } else {
                        const minutos = Math.floor(tiempoRestante / 60000);
                        const segundos = Math.floor((tiempoRestante % 60000) / 1000);
                        timerHtml = `<div class="timer-box" id="timer-${id}">⏳ Expira: ${minutos}:${segundos < 10 ? '0' : ''}${segundos}</div>`;
                        
                        if (!timersIntervals[id]) {
                            timersIntervals[id] = setInterval(() => actualizarRelojVisual(id, orden.timestamp), 1000);
                        }
                    }
                }

                // Promo Badge
                const promoBadge = orden.sodaGratis ? `<p style="color: var(--success); font-weight: bold; font-size: 0.85rem; margin-top:5px;">🥤 REGALAR SODA 2L (PROMO)</p>` : '';

                // Render de Botones según el Estado
                let botonesHtml = '';
                if (orden.estado === 'pendiente') {
                    botonesHtml = `
                        <button class="btn btn-success" onclick="cambiarEstado('${id}', 'aceptado')">Aceptar Orden</button>
                        <button class="btn btn-warn" onclick="notificarFaltaStock('${id}')">⚠️ Avisar Falta de Stock</button>
                        <button class="btn btn-danger" onclick="cambiarEstado('${id}', 'rechazado')">Rechazar</button>
                    `;
                } else if (orden.estado === 'aceptado') {
                    botonesHtml = `
                        <button class="btn btn-print" onclick="imprimirTicket('${id}')">🖨️ Imprimir Ticket</button>
                        <button class="btn btn-dark" onclick="eliminarOrdenDePantalla('${id}')">✓ Entregado (Cerrar)</button>
                        <button class="btn btn-danger" onclick="cambiarEstado('${id}', 'rechazado')">Cancelar Orden</button>
                    `;
                } else {
                    botonesHtml = `
                        <p style="text-align:center; font-weight:bold; color:var(--danger); margin:10px 0;">ORDEN RECHAZADA / CADUCADA</p>
                        <button class="btn btn-danger" onclick="eliminarOrdenDePantalla('${id}')">🗑️ Quitar de Pantalla</button>
                    `;
                    if(timersIntervals[id]) { clearInterval(timersIntervals[id]); delete timersIntervals[id]; }
                }

                card.innerHTML = `
                    ${timerHtml}
                    <div>
                        <h3>Orden ID: #${id.slice(-4).toUpperCase()}</h3>
                        <p style="font-size:0.8rem; color:#6B7280;">${new Date(orden.timestamp).toLocaleTimeString()}</p>
                        
                        <div class="info-cliente">
                            <p><strong>👤 Cliente:</strong> ${orden.cliente || orden.telefono || 'Anónimo'}</p>
                            <p><strong>📞 Teléfono:</strong> ${orden.telefono || 'S/N'}</p>
                            <p><strong>🚗 Servicio:</strong> ${(orden.servicio || orden.tipoEntrega || 'Para Llevar').toUpperCase()}</p>
                            <p><strong>💵 Pago:</strong> ${(orden.metodoPago || 'Efectivo').toUpperCase()}</p>
                            <p><strong>📍 Dirección:</strong> ${orden.direccion || 'Entrega en Tienda'}</p>
                        </div>

                        <ul class="lista-items">
                            ${itemsHtml}
                        </ul>
                        ${promoBadge}
                    </div>
                    <div>
                        <h2 style="color: var(--primary); margin: 10px 0; text-align:right;">Total: $${parseFloat(orden.total || 0).toFixed(2)}</h2>
                        ${botonesHtml}
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        // 3. CONTROLADOR DEL RELOJ VISUAL DEL TEMPORIZADOR
        function actualizarRelojVisual(id, timestamp) {
            const elem = document.getElementById(`timer-${id}`);
            if (!elem) return;

            const tiempoTranscurrido = Date.now() - timestamp;
            const tiempoRestante = Math.max(0, 300000 - tiempoTranscurrido);

            if (tiempoRestante <= 0) {
                clearInterval(timersIntervals[id]);
                delete timersIntervals[id];
                autoCancelarOrden(id);
            } else {
                const minutos = Math.floor(tiempoRestante / 60000);
                const segundos = Math.floor((tiempoRestante % 60000) / 1000);
                elem.innerText = `⏳ Expira: ${minutos}:${segundos < 10 ? '0' : ''}${segundos}`;
            }
        }

        // 4. SISTEMA DE AUTOCANCELACIÓN EN 5 MINUTOS
        function autoCancelarOrden(id) {
            database.ref('ordenes/' + id).update({
                estado: 'rechazado',
                motivoCancelacion: 'Tiempo de espera agotado (5 minutos sin confirmación).'
            });
        }

        // 5. NOTIFICACIÓN PREVIA DE STOCK AL CLIENTE
        function notificarFaltaStock(id) {
            const mensaje = prompt("¿Qué producto o ingrediente no está disponible? (Ej: No hay tripa):");
            if (!mensaje) return;

            database.ref('ordenes/' + id).update({
                estado: 'pendiente', 
                statusBadgeMod: 'warning',
                estadoMensajeCliente: `⚠️ ATENCIÓN: El restaurante informa que: "${mensaje}". Por favor, comunícate al 718.415.8963 para modificar tu pedido.`
            });
            alert("Notificación enviada al cliente.");
        }

        // 6. CAMBIO DE ESTADOS GENERALES (Aceptar / Rechazar)
        function cambiarEstado(id, nuevoEstado) {
            if(timersIntervals[id]) { clearInterval(timersIntervals[id]); delete timersIntervals[id]; }
            
            database.ref('ordenes/' + id).update({
                estado: nuevoEstado,
                estadoMensajeCliente: null
            });
        }

        // 7. FUNCIÓN NUEVA: Limpia las órdenes de la pantalla eliminándolas de Firebase
        function eliminarOrdenDePantalla(id) {
            if(confirm("¿Quieres quitar esta orden de la pantalla?")) {
                if(timersIntervals[id]) { clearInterval(timersIntervals[id]); delete timersIntervals[id]; }
                database.ref('ordenes/' + id).remove();
            }
        }

        // 8. SISTEMA DE GENERACIÓN E IMPRESIÓN DE TICKETS TÉRMICOS
        function imprimirTicket(id) {
            const orden = ordenesLocales[id];
            const areaTicket = document.getElementById('ticket-impresion');
            
            let itemsTexto = '';
            const listaComida = orden.productos || orden.items || [];
            listaComida.forEach(i => {
                const n = i.nombre || i.name || 'Producto';
                const m = i.nota || i.meta || '';
                itemsTexto += `${i.cantidad}x ${n.substring(0,20)}\n   ${m ? '('+m+')' : ''}\n`;
            });

            const estructuraTicket = `
================================
         TACOS EL PAISA
   Park at 6701 Bay Pkwy, NY
      Tel: 718.415.8963
================================
Ticket ID: #${id.slice(-4).toUpperCase()}
Fecha:  ${new Date(orden.timestamp).toLocaleDateString()}
Hora:   ${new Date(orden.timestamp).toLocaleTimeString()}
--------------------------------
Cliente: ${orden.cliente || 'Anónimo'}
Tel: ${orden.telefono || 'S/N'}
Servicio:    ${(orden.servicio || orden.tipoEntrega || 'Para Llevar').toUpperCase()}
Pago:        ${(orden.metodoPago || 'Efectivo').toUpperCase()}
Dirección:
${orden.direccion || 'Entrega en Tienda'}
--------------------------------
DETALLE DEL PEDIDO:
${itemsTexto}
--------------------------------
${orden.sodaGratis ? '* PROMO: SODA 2L GRATIS *\n--------------------------------' : ''}
TOTAL A COBRAR: $${parseFloat(orden.total || 0).toFixed(2)}
================================
   ¡Gracias por su compra!
================================
\n\n\n
            `;

            areaTicket.innerText = estructuraTicket;
            window.print();
        }
    </script>
</body>
</html>
